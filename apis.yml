name: Bloomy
description: >-
  Bloomy (bloomylearning.com) is an AI-powered adaptive learning platform for
  K-12 students, founded by Alex Southmayd and backed by Y Combinator (Summer
  2026 batch). The product diagnoses each student's knowledge gaps, builds a
  personalized standards-aligned learning path across English Language Arts,
  Math, and Writing, and delivers Socratic AI tutoring plus mastery-based
  practice, requiring 90%+ mastery before a student advances. It integrates
  third-party diagnostic/assessment data (i-Ready, NWEA MAP) and provides a
  real-time teacher dashboard. Bloomy serves traditional districts, charter
  schools, homeschools, and microschools, and sells to families via monthly or
  annual subscriptions (with ESA/EFA fund eligibility in some states). As of
  this profile Bloomy publishes no public API, developer portal, SDKs, or
  developer documentation; this record captures its verified public identity
  and legal/account surface only.
